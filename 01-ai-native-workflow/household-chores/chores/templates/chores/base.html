<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hearth · Household Chores{% endblock %}</title>
    <style>
      :root{--ink:#26322b;--muted:#65736a;--paper:#f8f7f2;--card:#fffefa;--line:#e6e6dc;--pine:#174e3d;--pine-light:#e1f0e8;--coral-light:#fcedea}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}.shell{max-width:1060px;margin:0 auto;padding:0 24px 48px}header{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;font-size:1.15rem;font-weight:800;letter-spacing:-.04em}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--pine);color:#fff;font-size:1.15rem}.button{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:42px;border:0;border-radius:12px;background:var(--pine);color:#fff;padding:10px 15px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:0 4px 12px rgba(23,78,61,.16);transition:transform .15s,background .15s}.button:hover{background:#0e392c;transform:translateY(-1px)}.button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f4c867;outline-offset:3px}.button-secondary{background:#fff;color:var(--pine);border:1px solid #cddbd2;box-shadow:none}.button-secondary:hover{background:var(--pine-light)}
      .page-intro{padding:34px 0 24px}h1,h2,p{margin-top:0}h1{margin-bottom:8px;font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;letter-spacing:-.065em}h2{letter-spacing:-.035em}.eyebrow{color:var(--pine);font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.lead{max-width:560px;color:var(--muted);font-size:1.06rem}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 30px}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.stat-number{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.06em}.stat-label{color:var(--muted);font-size:.85rem}
      .content-card{border:1px solid var(--line);border-radius:20px;background:var(--card);overflow:hidden;box-shadow:0 10px 28px rgba(40,51,43,.045)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 22px;border-bottom:1px solid var(--line)}.toolbar h2{margin:0;font-size:1.05rem}.filter{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.filter a{border:1px solid transparent;border-radius:999px;padding:6px 10px;color:var(--muted);font-size:.86rem;font-weight:650;text-decoration:none}.filter a:hover{background:var(--pine-light);color:var(--pine)}.filter a.active{background:var(--pine);color:#fff}.chore{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 22px;border-bottom:1px solid var(--line)}.chore:last-child{border-bottom:0}.chore:hover{background:#fcfdf9}.chore-main{display:flex;align-items:center;gap:14px;min-width:0}.chore-icon{display:grid;flex:0 0 auto;place-items:center;width:42px;height:42px;background:var(--pine-light);border-radius:13px;color:var(--pine);font-size:1.15rem}.chore-title{margin:0 0 3px;font-weight:800;letter-spacing:-.02em}.chore-meta{color:var(--muted);font-size:.88rem}.badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--coral-light);color:#a53f2e;font-size:.72rem;font-weight:800}.complete{background:#fff;color:var(--pine);border:1px solid #cddbd2;box-shadow:none;min-height:36px;padding:7px 11px;font-size:.86rem}.complete:hover{background:var(--pine-light)}
      .empty{display:grid;place-items:center;min-height:260px;padding:28px;color:var(--muted);text-align:center}.empty-icon{display:grid;place-items:center;width:58px;height:58px;margin-bottom:14px;border-radius:18px;background:var(--pine-light);color:var(--pine);font-size:1.65rem}.form-card{max-width:650px;padding:30px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 10px 28px rgba(40,51,43,.045)}label{display:block;margin-top:18px;font-size:.9rem;font-weight:750}input,select{width:100%;margin-top:7px;border:1px solid #cbd6ce;border-radius:10px;background:#fff;color:var(--ink);padding:11px 12px;font:inherit}.errorlist{margin:6px 0 0;padding:0;color:#a53f2e;font-size:.84rem;list-style:none}.form-actions{display:flex;gap:10px;align-items:center;margin-top:26px}@media(max-width:600px){.shell{padding:0 16px 32px}header{padding:16px 0}.header-button-text{display:none}.stats{gap:8px}.stat{padding:13px}.toolbar{align-items:flex-start;flex-direction:column}.chore{align-items:flex-start;padding:16px}.complete{flex:0 0 auto}.form-card{padding:22px}}
    </style>
  </head>
  <body><div class="shell"><header><a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">✦</span><span>Hearth</span></a><a class="button" href="{% url 'create_chore' %}"><span aria-hidden="true">+</span><span class="header-button-text">Add a chore</span></a></header><main>{% block content %}{% endblock %}</main></div></body>
</html>
