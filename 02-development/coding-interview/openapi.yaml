openapi: 3.0.3
info:
  title: PairPad API
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Report service health for deployment checks
      responses:
        '200':
          description: Service is healthy
  /api/sessions:
    post:
      summary: Create a collaborative interview session
      responses: {'201': {description: Created}}
  /api/sessions/{session_id}:
    get:
      summary: Get a session
      responses:
        '200':
          description: OK
        '404':
          description: Missing
    put:
      summary: Persist a document update
      responses:
        '200':
          description: Updated
        '404':
          description: Missing
  /ws/sessions/{session_id}:
    get:
      summary: WebSocket stream for document updates and WebRTC signaling
      description: |
        Clients send update messages for document changes and validated
        webrtc-signal messages containing offer, answer, or ICE candidate data.
        WebRTC signals are relayed to other clients in the same session and
        are not echoed to the sending client.
      responses:
        '101':
          description: Switching protocols
