name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: 02-development/coding-interview
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Smoke test deployed service
        env:
          PAIRPAD_URL: ${{ vars.PAIRPAD_URL }}
        run: |
          test -n "$PAIRPAD_URL"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$PAIRPAD_URL/healthz"; then exit 0; fi
            sleep 10
          done
          exit 1
