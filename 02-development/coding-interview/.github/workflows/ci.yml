name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-development/coding-interview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 02-development/coding-interview/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker build --tag pairpad:${{ github.sha }} .
