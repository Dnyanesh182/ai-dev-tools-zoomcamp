services:
  - type: web
    name: pairpad-coding-interview
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pairpad-postgres
          property: connectionString

databases:
  - name: pairpad-postgres
    databaseName: pairpad
    user: pairpad
    plan: free
